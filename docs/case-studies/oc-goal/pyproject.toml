[project]
name = "oc-goal"
version = "0.1.0"
description = "One-creator's Goal domain, served through Contexture."
requires-python = ">=3.10"
dependencies = ["contexture-mcp", "pydantic>=2.0"]

# This project is served, not distributed: no build system, never installed
# into the environment. `contexture serve` finds it by the table below and puts
# this directory on sys.path.
[tool.uv]
package = false

[tool.uv.sources]
contexture-mcp = { path = "../../.." }

[tool.contexture]
# One lazy application declaration; importing it constructs no role or store.
app = "oc_goal:app"
