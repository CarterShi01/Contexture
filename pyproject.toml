[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "contexture-mcp"
version = "0.6.0"
description = "A context framework for agents: declare roles, skills, tools, and resources once, then serve them to any agent runtime over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Contexture" }
]
keywords = ["agent", "context", "mcp", "llm", "claude-code", "codex", "cursor"]
dependencies = [
  "mcp>=2.0.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["mcp[cli]>=2.0.0"]

[project.scripts]
contexture = "contexture.cli:main"

[project.urls]
Repository = "https://github.com/CarterShi01/Contexture"

# The source tree deliberately stays flat: Contexture is the one module under
# this repository root. `uv_build` includes exactly that module — including
# its templates and typing files — and cannot reuse a stale `build/lib` tree.
[tool.uv.build-backend]
module-name = "contexture"
module-root = ""
