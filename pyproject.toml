[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contexture-mcp"
version = "0.5.1"
description = "A context framework for agents: declare roles, skills, tools, and resources once, then serve them to any agent runtime over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Contexture" }
]
keywords = ["agent", "context", "mcp", "llm", "claude-code", "codex", "cursor"]
dependencies = [
  "mcp>=2.0.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["mcp[cli]>=2.0.0"]

[project.scripts]
contexture = "contexture.cli:main"

[project.urls]
Repository = "https://github.com/CarterShi01/Contexture"

# Include-based, never exclude-based: the wheel holds `contexture` and its
# sub-packages, and nothing else at the top level can be swept in by being
# added later. That is what a `src/` directory used to express here, stated as
# one line of configuration instead of one level of directory.
[tool.setuptools.packages.find]
include = ["contexture*"]

[tool.setuptools.package-data]
# The templates live beside the command that renders them.
contexture = ["cli/templates/**/*"]
