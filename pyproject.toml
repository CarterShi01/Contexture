[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contexture"
version = "0.0.3"
description = "A context framework for agents: declare roles, skills, tools, and resources once, then render them for any agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Contexture" }
]
keywords = ["agent", "context", "mcp", "llm", "claude-code", "codex", "cursor"]
dependencies = []

[project.urls]
Repository = "https://github.com/CarterShi01/Contexture"

[tool.setuptools.packages.find]
where = ["src"]
