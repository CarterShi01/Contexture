[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contexture"
version = "0.0.5"
description = "A context framework for agents: declare roles, skills, tools, and resources once, then serve them to any agent runtime over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Contexture" }
]
keywords = ["agent", "context", "mcp", "llm", "claude-code", "codex", "cursor"]
dependencies = [
  "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["mcp[cli]>=2.0.0"]

[project.scripts]
contexture-incident-demo = "contexture.examples.incident.server:main"

[project.urls]
Repository = "https://github.com/CarterShi01/Contexture"

[tool.setuptools.packages.find]
where = ["src"]
